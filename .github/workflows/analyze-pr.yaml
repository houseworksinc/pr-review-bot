name: Reusable PR Analysis with LLM

on:
  push:
    branches:
      - Feature/ChangeLog
# on:
#   pull_request:
#     types: [opened, synchronize, reopened]
#   workflow_call:
#     secrets:
#       GOOGLE_API_KEY:
#         required: true

jobs:
  analyze_pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GitHub CLI
        run: |
          gh auth setup-git
          gh auth status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch PR Files and Diff
        id: pr_diff
        run: |
          # Get PR diff
          gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }} > pr_diff.txt
          
          # Get list of changed files
          gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json files --jq '.files[].path' > changed_files.txt
          
          # Create context about the changes
          {
            echo "Changed files:"
            cat changed_files.txt
            echo -e "\nDiff content:"
            cat pr_diff.txt
          } > pr_context.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Analyze PR with Gemini
        id: analyze_pr
        run: |
          # Create the prompt template
          cat > prompt_template.txt << 'EOF'
          You are an experienced senior developer and PR reviewer with expertise in code quality, security, and best practices. Review this PR and provide a clear, well-formatted analysis.

          Structure your response as:

          **Summary:** What this PR accomplishes

          **Changes:** Key files modified and their purpose

          **Analysis:** Any issues found - security, performance, code quality, or missing error handling

          **Recommendation:** Specific actionable improvements if issues exist

          Use clear formatting with **bold** headers and bullet points where helpful. Be thorough but concise - focus on what matters most.
          EOF
          
          # Combine template with PR context and escape for JSON
          PROMPT_TEMPLATE=$(cat prompt_template.txt)
          FULL_PROMPT=$(printf "%s\n\nHere are the changes:\n%s" "$PROMPT_TEMPLATE" "$(cat pr_context.txt)")
          ESCAPED_PROMPT=$(echo "$FULL_PROMPT" | jq -Rs .)
          
          # Make the API call to Gemini
          cat > request.json << EOF
          {
            "contents": [{
              "parts":[{
                "text": ${ESCAPED_PROMPT}
              }]
            }],
            "generationConfig": {
              "temperature": 0.7,
              "topK": 40,
              "topP": 0.95,
              "maxOutputTokens": 800
            }
          }
          EOF
          
          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${{ secrets.GOOGLE_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d @request.json)

          # Check for API errors
          if [ "$(echo "$RESPONSE" | jq -r '.error')" != "null" ]; then
            echo "Error from Gemini API: $(echo "$RESPONSE" | jq -r '.error.message')"
            exit 1
          fi

          # Extract the generated text from response
          REVIEW_CONTENT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text')

          # Format and save the response
          cat > result.txt << EOF
          RESULT<<EOFMARKER
          # 🤖 Automated PR Review

          $REVIEW_CONTENT

          ---
          _Generated by PR Review Bot (Gemini)_ | [📝 Report Issues](https://github.com/houseworksinc/pr-review-bot/issues)
          EOFMARKER
          EOF
          
          cat result.txt >> $GITHUB_ENV

      - name: Comment on PR
        uses: mshick/add-pr-comment@v2
        with:
          message: ${{ env.RESULT }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}